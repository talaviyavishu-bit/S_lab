
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #263b63);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid #64748b;
      border-radius: 30px;
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .button:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 60px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="badge">WEBSITE UNDER CONSTRUCTION</div>

    <h1>Something Great Is Coming.</h1>

    <p>
      We're working on something new.
      Our website will be available soon.
      Stay tuned for updates!
    </p>

    <button class="button" onclick="showMessage()">
      Notify Me
    </button>

    <footer>
      &copy; <span id="year"></span> Your Website.
      All rights reserved.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showMessage() {
      alert("Thanks for your interest! Check back soon.");
    }
  </script>
</body>
</html>
